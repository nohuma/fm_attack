# BadVLA stage 1 on pi0. Fields match BDConfig.
# alpha = min(lora_rank, 16) = min(4, 16) = 4

model:
  model_path_or_name: /root/autodl-tmp/pi0_libero_finetuned
  processor_path: null
  camera_keys:
    - observation.images.image
    - observation.images.image2

data:
  dataset_repo_id: lerobot/libero
  dataset_dir: /root/fm_attack/datasets/lerobot/libero
  dataset_fps: 10.0
  poison_ratio: 0.1
  trigger: patch
  trigger_path: null
  trigger_size: 0.1
  trigger_position: center
  trigger_color: 255

training:
  batch_size: 8
  learning_rate: 5.0e-4
  max_steps: 10 # FIXME:  
  lr_scheduler: badvla
  num_steps_before_decay: 10 # FIXME: 
  lr_decay_gamma: 0.1
  grad_accumulation_steps: 1
  seed: 718

logging:
  wandb_entity: ""
  wandb_project: fm_attack
  wandb_log_freq: 1                  # FIXME: 频繁保存会比较慢
  output_dir: /root/autodl-tmp/outputs
  save_freq: null
  save_latest_checkpoint_only: false

attack:
  name: badvla
  stage: 1
  # [separation]
  loss_weights: [1.0]
  # [VLM backbone]
  lora:
    - rank: 4
      alpha: 4
      dropout: 0.0
  merge_lora: false
  stage1_path: null
